name: CI

on:
  push:
    branches: [main, "release-*.x"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Install exactly what mise.lock records.
  MISE_LOCKED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run lint
        env:
          # pinact and zizmor's online audits query the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}

  format:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      - run: mise run test

  test-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # mise.lock records only Go for Windows, so mise run must not install
      # the other tools.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
          install_args: go
      # -v lists the tests that ran, including the Windows-only ones.
      - run: mise run test -- -v

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
      # Builds every release archive, so a broken cross-compile or GoReleaser
      # config fails here instead of in the release job.
      - run: mise run build

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: [lint, format, test, test-windows, build]
    # Keeps pull request and feature-branch runs out of the release
    # environment. This is only a filter: anyone who can push a branch can
    # edit it, so the environment's deployment branch policy is what
    # restricts access to the App key.
    if: >-
      github.event_name == 'push' && (
        github.ref_name == 'main' || (
          startsWith(github.ref_name, 'release-') &&
          endsWith(github.ref_name, '.x')
        )
      )
    environment: release
    # The GitHub App tokens do the writing; the job token needs nothing.
    permissions: {}
    steps:
      # Creates the release as a draft, and its tag.
      - uses: krystal/release-please-manifest-action@40085023b8f3a14a9f33cbc3c5d994b5083500eb # v4.0.0
        id: release-please
        with:
          target-branch-pattern: '^(main|release-[0-9]+(\.[0-9]+)?\.x)$'
          client-id: ${{ vars.RELEASE_PLEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: steps.release-please.outputs.release_created == 'true'
        with:
          client-id: ${{ vars.RELEASE_PLEASE_GITHUB_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_GITHUB_APP_PRIVATE_KEY }}
          permission-actions: write
      # The Release workflow builds and attaches the archives, then publishes
      # the draft. It runs on this branch, which decides whether the release
      # becomes the latest release.
      - name: Start the Release workflow
        if: steps.release-please.outputs.release_created == 'true'
        run: gh workflow run release.yml --ref "$GITHUB_REF_NAME" -f tag="$TAG"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release-please.outputs.tag_name }}
