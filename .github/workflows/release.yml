name: Release

# Attaches the release archives to a draft release that release-please
# created, then publishes it. An immutable release's assets cannot change once
# it is published, so publishing is the last step. The Release Please job in
# CI starts this workflow for each release it creates, on the branch it
# released from. Its runs keep their inputs, so re-run a failed run, or run it
# by hand from that branch, to finish a draft.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release, for example v0.1.0
        required: true
        type: string

permissions: {}

# Runs for one tag never overlap, so a second run waits and then finds the
# release already published.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}

env:
  # Install exactly what mise.lock records.
  MISE_LOCKED: "1"

jobs:
  assets:
    name: Release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Runs the workflow as reviewed on a release branch, and fails rather
      # than skips elsewhere so a manual run cannot look like it succeeded.
      # This is only a check: anyone who can push a branch can edit it.
      - name: Check the branch
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" && "$GITHUB_REF_NAME" != release-*.x ]]; then
            echo "::error::Run this workflow from main or the release-*.x branch the release was cut from."
            exit 1
          fi
      - name: Check that the release is a draft
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::Release $TAG is already published, so its assets cannot change."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          # GoReleaser reads the version from the tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          github_token: ${{ github.token }}
          # Apply the project's three-day cooldown to mise itself.
          minimum_release_age: 3d
          # Build release archives only from tools mise.lock verifies, never
          # from a cache that another run wrote. zizmor's cache-poisoning
          # audit does not check this workflow's triggers, so keep this.
          cache: false
      - run: mise run build:release
      # --clobber replaces assets an earlier, failed attempt uploaded. The
      # config file's JSON schema keeps an unversioned name, so the latest
      # release's URL for it never changes, and the checksums file lists it.
      - name: Upload the archives and schema to the draft release
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*_checksums.txt schemas/config.schema.json --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # Only releases from main become the latest release, so a maintenance
      # release from a release-*.x branch does not displace it.
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --verify-tag --latest="$LATEST"
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ github.ref_name == 'main' }}
