version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nolintlint
    - revive
  settings:
    forbidigo:
      # The aopctl package reads no environment, writes nothing to stdio and
      # never prompts; the command does that.
      forbid:
        - pattern: ^os\.(Getenv|LookupEnv|Environ|Stdin|Stdout|Stderr|Exit|OpenFile)$
          msg: the aopctl package must not use the environment, stdio or a terminal
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: the aopctl package must not write to stdout
        - pattern: ^log\.
          msg: the aopctl package must not log
  exclusions:
    # Unchecked Close and fmt.Fprint* errors, mostly in test cleanup.
    presets:
      - std-error-handling
    rules:
      - path-except: ^aopctl/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
