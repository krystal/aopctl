version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
  exclusions:
    # Unchecked Close and fmt.Fprint* errors, mostly in test cleanup.
    presets:
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
