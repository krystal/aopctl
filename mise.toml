[settings]
# mise.lock pins exact versions and checksums; [tools] pins majors only.
lockfile = true
# Skip tool releases younger than three days.
minimum_release_age = "3d"

[tools]
go = "1"
golangci-lint = "2"
goreleaser = "2"
actionlint = "1"
pinact = "5"
zizmor = "1"
lefthook = "2"

[tasks.setup]
description = "Install tools and the lefthook git hooks"
run = ["mise install", "lefthook install"]

[tasks.format]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks."format:check"]
description = "Check Go formatting without changing files"
run = "golangci-lint fmt --diff"

[tasks."lint:go"]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks."lint:actions"]
description = "Check GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks."lint:zizmor"]
description = "Audit GitHub Actions workflows with zizmor, online when a GitHub token is set"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [[ -n "${GH_TOKEN:-${GITHUB_TOKEN:-}}" ]]; then
  zizmor .github
else
  zizmor --offline .github
fi
'''

[tasks."lint:pinact"]
description = "Check that GitHub Actions are SHA-pinned to releases at least three days old"
run = "pinact run --check --verify-comment --min-age 3"

[tasks."lint:goreleaser"]
description = "Check the GoReleaser configuration"
run = "goreleaser check"

[tasks."pin:actions"]
description = "Pin GitHub Actions to full commit SHAs"
run = "pinact run --min-age 3"

[tasks.lint]
description = "Run all linters"
depends = ["lint:go", "lint:actions", "lint:zizmor", "lint:pinact", "lint:goreleaser"]

[tasks.test]
description = "Run unit tests"
run = "go test -count=1 ./..."

[tasks."generate:schema"]
description = "Regenerate the config file's JSON schema from its Go types"
run = "go test ./cli -run '^TestConfigSchema$' -count=1 -update"

[tasks.build]
description = "Build snapshot release archives for every platform into dist/"
run = "goreleaser release --snapshot --clean"

[tasks."build:release"]
description = "Build release archives for the tag at HEAD into dist/, without publishing"
run = "goreleaser release --clean --skip=publish"

[tasks.check]
description = "Run format checks, linters and unit tests"
depends = ["format:check", "lint", "test"]
